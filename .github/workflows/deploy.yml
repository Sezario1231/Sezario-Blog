name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}" >> .env
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env
          echo "PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Build
        run: npm run build

      - name: Check inlined env (debug)
        run: |
          ls -la .env > dist/env-ls.txt
          (grep -rl "lckftybogvxbacaeuaxc" dist/_worker.js/ || echo "URL_NOT_INLINED") > dist/inline-check.txt
          (grep -rl "sb_secret_" dist/_worker.js/ || echo "SVC_NOT_INLINED") >> dist/inline-check.txt
          ls dist/_worker.js/ >> dist/inline-check.txt
          cat dist/inline-check.txt

      - name: Verify .env (debug)
        run: node -e 'const fs=require("fs");const e=fs.readFileSync(".env","utf8").trim().split("\n");const out=e.map(l=>{const i=l.indexOf("=");return i>0?l.slice(0,i)+" len="+(l.length-i-1):"<"+l+">"}).join("\n");fs.writeFileSync("dist/env-check.txt",out)'

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name sezario-blog --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
