name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}" >> .env
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env
          echo "PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Build
        run: npm run build

      - name: Debug job env (debug)
        run: |
          echo "SUPABASE_URL len=${#SUPABASE_URL}" > dist/env-debug.txt
          echo "SERVICE len=${#SUPABASE_SERVICE_ROLE_KEY}" >> dist/env-debug.txt
          echo "ADMIN len=${#ADMIN_PASSWORD}" >> dist/env-debug.txt

      - name: Check inlined env (debug)
        run: |
          ls -la .env > dist/env-ls.txt
          (grep -rl "lckftybogvxbacaeuaxc" dist/_worker.js/ || echo "URL_NOT_INLINED") > dist/inline-check.txt
          (grep -rl "sb_secret_" dist/_worker.js/ || echo "SVC_NOT_INLINED") >> dist/inline-check.txt
          ls dist/_worker.js/ >> dist/inline-check.txt
          cat dist/inline-check.txt

      - name: Dump supabase snippet (debug)
        run: |
          SRC=$(find dist/_worker.js/chunks -name 'supabase_*.mjs' | head -1)
          echo "chunk: $SRC" > dist/snippet2.txt
          node -e "const s=require('fs').readFileSync(process.argv[1],'utf8'); const i=s.indexOf('\u73af\u5883\u53d8\u91cf\u672a\u914d\u7f6e'); console.log('marker at:', i); console.log(s.slice(Math.max(0,i-600), i+300));" "$SRC" >> dist/snippet2.txt 2>&1
          cat dist/snippet2.txt

      - name: Verify .env (debug)
        run: node -e 'const fs=require("fs");const e=fs.readFileSync(".env","utf8").trim().split("\n");const out=e.map(l=>{const i=l.indexOf("=");return i>0?l.slice(0,i)+" len="+(l.length-i-1):"<"+l+">"}).join("\n");fs.writeFileSync("dist/env-check.txt",out)'

      - name: Copy build env debug
        run: cp dist-build-env.json dist/

      - name: Set Pages secrets (persist, survives deploys)
        run: |
          npx wrangler pages secret put SUPABASE_URL --project-name sezario-blog <<< "${{ secrets.SUPABASE_URL }}"
          npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name sezario-blog <<< "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          npx wrangler pages secret put ADMIN_PASSWORD --project-name sezario-blog <<< "${{ secrets.ADMIN_PASSWORD }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name sezario-blog --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
