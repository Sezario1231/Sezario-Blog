name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Env fingerprint (debug)
        run: node -e 'const fs=require("fs"); fs.writeFileSync("dist/_env-debug.txt", JSON.stringify({site:process.env.PUBLIC_SITE_URL,url:process.env.PUBLIC_SUPABASE_URL,urlLen:(process.env.PUBLIC_SUPABASE_URL||"").length,keyLen:(process.env.PUBLIC_SUPABASE_ANON_KEY||"").length,keyHasQuote:(process.env.PUBLIC_SUPABASE_ANON_KEY||"").includes("\""),keyHead:(process.env.PUBLIC_SUPABASE_ANON_KEY||"").slice(0,10),svcLen:(process.env.SUPABASE_SERVICE_ROLE_KEY||"").length,adminLen:(process.env.ADMIN_PASSWORD||"").length}))'

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name sezario-blog --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
